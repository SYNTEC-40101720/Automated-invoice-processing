[project]
name = "invoice-processor"
version = "7.0.4"
description = "SYNTEC 电子票据处理系统"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=6.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "pywebview>=5.3.0",
]

[project.scripts]
invoice-processor = "main:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "invoice-processor"
version = "7.6.0"
description = "SYNTEC 电子票据处理系统"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=6.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
    "pywebview>=5.3.0",
    "pypdfium2>=4.0",
    "pyyaml>=6.0",
    "rapidocr-onnxruntime>=1.4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
invoice-processor = "main:main"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# 打包脚本需要先注入 sys.path 才能导入 backend/scripts 内模块
"scripts/build_syntec.py" = ["E402"]
# 冒烟脚本同样需要先注入 sys.path 才能读取版本号
"scripts/smoke_launch.py" = ["E402"]
# 桌面入口同样需要先注入 sys.path 才能导入 backend 包
"main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "scripts"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["devbase*", "invoice_processor*"]

[tool.pyinstaller]
# rapidocr 模型文件与 onnxruntime DLL 由 scripts/build_syntec.py 的 collect 段收集

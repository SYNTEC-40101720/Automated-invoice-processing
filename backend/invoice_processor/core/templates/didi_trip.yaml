# 滴滴出行行程单模板
# ─────────────────────────────────────────────────────────────
# 语义（ADR D2 · invoice2data 模式）：
#   issuer            匹配关键词列表，全部命中才算本模板（AND 语义）
#   doc_type          对应现有票种标识（与 processor 注册表票种对应）
#   fields            字段名 → 正则（单条或多条候选，多候选取首个命中捕获组）
#   exclude_keywords  命中任一则不匹配本模板
# 当前策略：模板仅旁路抽取+写「模板抽取」日志，不改变判定与输出。
#
# 示例匹配文本（可命中）：
#   滴滴出行-行程单
#   上车时间：2026-10-27 09:30  下车时间：2026-10-27 09:52
#   起点：杭州市西湖区文一西路 508 号  终点：杭州东站
#   里程：12.3公里  合计：45.60元
# ─────────────────────────────────────────────────────────────
issuer:
  - 滴滴
doc_type: didi_trip
fields:
  date:
    - '上车时间[：:]\s*([0-9]{4}[-.\-/][0-9]{1,2}[-.\-/][0-9]{1,2})'
  amount:
    - '(?:合计|费用|支付金额)[：:￥¥\s]*([0-9][0-9,]*\.?[0-9]{0,2})元?'
  mileage:
    - '(?:里程|行驶里程|公里数)[：:]\s*([0-9]+(?:\.[0-9]+)?)'
  start:
    - '起点[：:]\s*([^\s，。；]{2,40})'
  end:
    - '终点[：:]\s*([^\s，。；]{2,40})'

# 浙江通用（电子）发票模板
# ─────────────────────────────────────────────────────────────
# 语义（ADR D2 · invoice2data 模式）：
#   issuer            匹配关键词列表，全部命中才算本模板（AND 语义）
#   doc_type          对应现有票种标识（与 processor 注册表票种对应）
#   fields            字段名 → 正则（单条或多条候选，多候选取首个命中捕获组）
#   exclude_keywords  命中任一则不匹配本模板
# 当前策略：模板仅旁路抽取+写「模板抽取」日志，不改变判定与输出。
#
# 示例匹配文本（可命中）：
#   浙江通用（电子）发票
#   发票号码：24317000000123456789
#   开票日期：2026年10月27日
#   价税合计（大写）壹仟贰佰叁拾肆元伍角陆分（小写）￥1,234.56
#   销售方名称：杭州某某机械有限公司 纳税人识别号：91330100MA27XXXX0X
# ─────────────────────────────────────────────────────────────
issuer:
  - 浙江
  - 增值税
doc_type: zhejiang_vat
fields:
  invoice_number:
    - '发票号码[：:]\s*([0-9]{8,20})'
  invoice_date:
    - '开票日期[：:]\s*([0-9]{4}[年.\-/][0-9]{1,2}[月.\-/][0-9]{1,2}日?)'
  # 价税合计（小写）金额：兼容 ￥/¥ 前缀与千分位（宽松：数字+逗号+点）
  amount_tax:
    - '(?:价税合计|（小写）|\(小写\))[^0-9￥¥]{0,20}[￥¥]?\s*([0-9][0-9,]*\.[0-9]{2})'
  seller_name:
    - '(?:销售方名称|销售方|销\s*售\s*方)名称?[：:]\s*([^\s，。；]{2,40})'

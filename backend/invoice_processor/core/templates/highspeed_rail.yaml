# 高铁/铁路电子客票模板
# ─────────────────────────────────────────────────────────────
# 语义（ADR D2 · invoice2data 模式）：
#   issuer            匹配关键词列表，全部命中才算本模板（AND 语义）
#   doc_type          对应现有票种标识（与 processor 注册表票种对应）
#   fields            字段名 → 正则（单条或多条候选，多候选取首个命中捕获组）
#   exclude_keywords  命中任一则不匹配本模板
# 当前策略：模板仅旁路抽取+写「模板抽取」日志，不改变判定与输出。
#
# 示例匹配文本（可命中）：
#   中国铁路 电子客票
#   旅客姓名：张三 车次：G7348
#   乘车日期：2026年10月27日  发站：杭州东  到站：上海虹桥
#   金额：￥268.00
# ─────────────────────────────────────────────────────────────
issuer:
  - 铁路
  - 车票
doc_type: highspeed_rail
exclude_keywords:
  # 汇总单/统计类文本含「车票」但不该命中高铁票模板
  - 汇总单
fields:
  passenger_name:
    - '(?:旅客姓名|乘客姓名)[：:]\s*([\u4e00-\u9fa5A-Za-z·]{2,20})'
  train_number:
    - '车次[：:]\s*([GDCZTKL][0-9]{1,5})'
  date:
    - '(?:乘车日期|乘车时间|日期时间|开车日期)[：:]\s*([0-9]{4}[年.\-/][0-9]{1,2}[月.\-/][0-9]{1,2}日?)'
  amount:
    - '(?:金额|票价|￥|¥)[：:￥¥\s]*([0-9][0-9,]*\.[0-9]{2})'
  from_station:
    - '(?:发站|出发站|起始站)[：:]\s*([\u4e00-\u9fa5]{2,15})'
  to_station:
    - '(?:到站|到达站|目的站)[：:]\s*([\u4e00-\u9fa5]{2,15})'
